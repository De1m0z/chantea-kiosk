services:
  api:
    build:
      context: ./cheentea-api
      dockerfile: Dockerfile
    container_name: cheentea-api
    ports:
      - "8000:80"
      - "9090:8080"
    environment:
      - APP_NAME=CheenTea
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
      - CACHE_STORE=database
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=cheentea-local
      - REVERB_APP_KEY=cheentea-local-key
      - REVERB_APP_SECRET=cheentea-local-secret
      - REVERB_HOST=0.0.0.0
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
      - SANCTUM_STATEFUL_DOMAINS=localhost,localhost:3000,127.0.0.1,127.0.0.1:8000
    volumes:
      - api-storage:/var/www/storage
      - api-db:/var/www/database
    restart: unless-stopped

  frontend:
    build:
      context: ./cheentea-frontend
      dockerfile: Dockerfile
    container_name: cheentea-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_REVERB_APP_KEY=cheentea-local-key
      - NEXT_PUBLIC_REVERB_HOST=localhost
      - NEXT_PUBLIC_REVERB_PORT=9090
      - NEXT_PUBLIC_REVERB_SCHEME=http
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-storage:
  api-db:
